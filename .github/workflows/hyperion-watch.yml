name: Hyperion takibi

# Upstream is the roadmap, and upstream keeps moving. "Check their repository
# sometimes" is not a plan; a weekly job that opens one issue and keeps editing
# it is. One issue, reopened and rewritten rather than a new one each week -
# twelve stale copies of the same digest is how a tracker stops being read.
on:
  schedule:
    # Mondays, 06:00 UTC. Weekly rather than daily on purpose: Hyperion merges a
    # handful of commits a week, and a daily digest would mostly say "nothing".
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hyperion-watch
  cancel-in-progress: false

jobs:
  digest:
    name: Yeni commit'leri sınıfla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The upstream clone is blobless and single-branch; caching it turns a
      # ~30 s clone into a fetch of whatever landed that week.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hyperion-watch-checkout
          key: hyperion-checkout-${{ github.run_id }}
          restore-keys: hyperion-checkout-

      - name: Digest
        id: digest
        run: |
          node scripts/hyperion-watch.mjs > digest.md
          node scripts/hyperion-watch.mjs --json > digest.json
          echo "count=$(node -e "console.log(require('./digest.json').count)")" >> "$GITHUB_OUTPUT"

      - name: Issue'yu aç ya da güncelle
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const body = fs.readFileSync('digest.md', 'utf8')
            const title = 'Hyperion.NG takibi'
            const count = Number('${{ steps.digest.outputs.count }}')

            const { data: found } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'hyperion-watch',
              per_page: 10
            })
            const existing = found[0]

            // Nothing new and no open issue: say nothing. A tracker that posts
            // "no changes" every week trains everyone to ignore it.
            if (count === 0 && (existing === undefined || existing.state === 'closed')) {
              core.info('Yeni bir şey yok, issue açılmadı.')
              return
            }

            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['hyperion-watch']
              })
              return
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
              // Reopened when there is something to look at, closed when the
              // marker has caught up - so the issue's own state answers
              // "is there anything to port".
              state: count === 0 ? 'closed' : 'open'
            })
