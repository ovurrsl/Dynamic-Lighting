<!doctype html>
<meta charset="utf-8">
<title>AmbiFlux</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px; width: 260px; background: #111; color: #eee; }
  button { width: 100%; padding: 10px; margin-top: 8px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
  #start { background: #3b82f6; color: #fff; }
  #stop { background: #333; color: #eee; }
  #serial, #selftest { background: #222; color: #eee; }
  #status { color: #9a9a9a; margin-top: 10px; font-size: 12px; white-space: pre-line; }
</style>
<strong>AmbiFlux</strong>
<!--
  The labels here are the English fallback and are replaced on load from
  _locales/<lang>/messages.json (popup.ts), because Chrome substitutes
  __MSG_key__ in the manifest and in CSS but never in HTML.
-->
<button id="serial" data-msg="pairSerial">Pair serial port</button>
<button id="start" data-msg="startCapture">Start capture</button>
<button id="stop" data-msg="stop">Stop</button>
<button id="selftest" data-msg="selfTest">Test without a screen</button>
<div id="status">…</div>
<script type="module" src="popup.js"></script>
