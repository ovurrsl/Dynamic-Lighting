; AmbiFlux firmware — Arduino Nano ESP32 (ESP32-S3).
;
; PlatformIO rather than the Arduino IDE because this is a product: the build
; has to be reproducible and runnable in CI, and a sketch in an IDE gives
; neither. The pioarduino fork is used because upstream platform-espressif32
; has not tracked Arduino-ESP32 3.x.
[env:nano_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = arduino_nano_esp32
framework = arduino
monitor_speed = 921600

build_flags =
  ; USB CDC on boot, and NOT the USB-OTG stack: the board must appear as a
  ; serial port the moment it is plugged in.
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D AMBIFLUX_VERSION='"0.1.0"'
  ; Warnings on, and a printf whose arguments do not match its format is an
  ; ERROR: the telemetry line shipped with one specifier fewer than its
  ; arguments, so "up" printed the bench flag, and nothing said so.
  -Wall -Wformat=2 -Werror=format
  ; Compile-time ceiling only. The LED count itself is configuration and
  ; arrives over the wire: a `#define TOP_LEDS 35` nails the firmware to one
  ; monitor, which is the opposite of a product.
  -D AMBIFLUX_MAX_LEDS=512

; WiFi and Bluetooth are not merely unused, they are deliberately unlinked.
; The most common cause of RMT/I2S LED corruption on ESP32 is WiFi ISR work on
; core 0, and a USB-attached product has no reason to carry the stack at all.
build_unflags = -DCONFIG_ESP32_WIFI_ENABLED -DCONFIG_BT_ENABLED

lib_deps =
  makuna/NeoPixelBus @ ^2.8.0

; The DMA-fed output method, built in CI alongside the default.
;
; RMT vs DMA is a measurement on real hardware (`shortFrames` in the telemetry
; settles it); the point of this env is narrower. An option that does not
; compile is not an option, and this one already caught a real mistake: the
; obvious "use I2S" is compiled out on the ESP32-S3, whose DMA path is the LCD
; peripheral instead. Without a build here that would have rotted silently
; until the day someone reached for it.
[env:nano_esp32_dma]
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -D AMBIFLUX_OUTPUT_DMA

; Host build: the pure parts (parser, dither, power limiter, interpolation)
; compile and run here, so they are exercised without a board. A parser only
; ever run on hardware is a parser whose resync rule nobody has tried.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Wformat=2 -Werror=format
test_framework = unity

; The network build: WiFi linked, and a WebSocket server carrying the same
; frames the cable does.
;
; Separate from the default rather than a runtime switch, because the cost is
; physical. The USB build unlinks the WiFi stack deliberately - WiFi interrupt
; work on the LED's core is the usual cause of RMT corruption on an ESP32 - so a
; board driven over a cable should not be made to pay for a radio it never uses.
; Here the stack comes back and the server task is pinned to core 0 in main.cpp.
;
; It exists because of a platform fact, not a preference: on iOS there is no Web
; Serial, no WebUSB, no WebHID and no Web Bluetooth, so a browser there has the
; network or it has nothing.
[env:nano_esp32_net]
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -D AMBIFLUX_NET
; Bluetooth stays unlinked; WiFi cannot, which is the entire point of this env.
build_unflags = -DCONFIG_BT_ENABLED
